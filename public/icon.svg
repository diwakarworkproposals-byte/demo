<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner border ring -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.15" />

  <!-- Stylized Branding Monogram "AB" -->
  <g filter="url(#shadow)">
    <text x="256" y="315" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Google Sans', 'Roboto', sans-serif" 
          font-size="200" 
          font-weight="900" 
          letter-spacing="-6" 
          fill="#ffffff" 
          text-anchor="middle">
      AB
    </text>
  </g>

  <!-- Vibrant Accent Tag: SaaS Stock & Billing -->
  <rect x="136" y="365" width="240" height="28" rx="14" fill="url(#accentGrad)" filter="url(#shadow)" />
  <text x="256" y="384" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Google Sans', 'Roboto', sans-serif" 
        font-size="14" 
        font-weight="800" 
        letter-spacing="3" 
        fill="#ffffff" 
        text-anchor="middle">
    ASAN BILL
  </text>
</svg>
